[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-tools"
version = "0.1.0"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
description = "This is tools for testing and creating mock python projects that use vault, k8s, and vmware."
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "kubernetes>=25.3.0",
    "pyvmomi>=8.0.3.0.1",
    "hvac>=1.2.1",
    "click>=8.1.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=vault_tools"

[tool.mypy]
python_version = "3.9"
strict = true
