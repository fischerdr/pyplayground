# Podman-specific configuration for GitHub Stars Dashboard
# This file contains Podman-specific settings and options
# Format: INI-style configuration

[socket]
PODMAN_SOCKET = unix:///run/podman/podman.sock

[compose]
PODMAN_COMPOSE_VERSION = 2

[resources]
APP_MEMORY_LIMIT = 512m
APP_CPU_LIMIT = 0.5
SCHEDULER_MEMORY_LIMIT = 256m
SCHEDULER_CPU_LIMIT = 0.25

[network]
PODMAN_NETWORK_NAME = github_stars_network
PODMAN_NETWORK_SUBNET = 172.28.0.0/16

[volumes]
VOLUME_DRIVER = local
VOLUME_MOUNT_OPTIONS = rw,relatime

[security]
SECURITY_PROFILE = restricted
SECCOMP_PROFILE = podman-default-seccomp.json
APPARMOR_PROFILE = unconfined

[logging]
LOG_DRIVER = json-file
LOG_OPTIONS = max-size=10m,max-file=3

[policy]
RESTART_POLICY = unless-stopped
MAX_RESTART_COUNT = 10

[users]
CONTAINER_USER = appuser
CONTAINER_UID = 1000
CONTAINER_GID = 1000

[build]
PODMAN_PULL_POLICY = always
PODMAN_BUILD_NO_CACHE = false
