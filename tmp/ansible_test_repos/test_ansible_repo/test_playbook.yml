---
- name: Test Playbook for Ansible Analyzer
  hosts: all
  vars:
    app_name: "myapp"
    version: "1.0"
  tasks:
    - name: Install curl
      shell: curl -o /tmp/installer.sh https://example.com/install.sh

    - name: Run application with variables
      command: "{{ app_name }} --version {{ version }} --check"

    - name: Complex shell command
      shell: |
        echo "Starting deployment" && \
        /usr/bin/docker run -d --name {{ app_name }} nginx:latest && \
        sleep 5

    - name: Raw command example
      raw: systemctl status nginx

    - name: Script execution
      script: /path/to/script.sh 