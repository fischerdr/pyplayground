[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyplayground"
version = "0.1.0"
authors = [
    { name = "David Fischer", email = "fischer.d.r@gmail.com" }
]
description = "A Python-based mock and testing environment for Kubernetes, VMware, and HashiCorp Vault APIs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ansible-builder>=1.0.0",
    "ansible-core>=2.14.9",
    "ansible-runner>=2.3.0",
    "awxkit>=24.6.1",
    "boto3>=1.37.0",
    "click>=8.1.0",
    "cryptography>=44.0.0",
    "filelock>=3.20.1",
    "hvac>=1.2.1",
    "kubernetes>=25.3.0",
    "markdown>=3.0.0",
    "pick>=2.4.0",
    "pint>=0.24.0",
    "psycopg2-binary>=2.9.10",
    "pyOpenSSL>=25.0.0",
    "python-dotenv>=1.0.0",
    "pyvmomi>=8.0.3.0.1",
    "pyyaml>=6.0.1",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "urllib3>=2.6.0",
    "pyasn1>=0.6.2",
    "structlog>=23.2.0",
    "tenacity>=9.1.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
# Development dependencies
dev = [
    # Testing framework
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # # "pytest-qt>=4.2.0",        # For wxPython GUI testing
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",     # Parallel test execution

    # Code formatting
    "black>=23.7.0",
    "isort>=5.12.0",
    
    # Markdownb linting
    "pymarkdownlnt>=0.9.34",

    # Linting
    "flake8>=6.1.0",
    "flake8-docstrings>=1.7.0",
    "flake8-bugbear>=23.9.0",
    "pep8-naming>=0.13.0",
    "ruff>=0.0.280",
    
    # Type checking
    "mypy>=1.5.0",
    "types-Pillow>=10.0.0",

    # Documentation
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",

    # Dependency management
    "pip-tools>=7.0.0",

    # Pre-commit hooks
    "pre-commit>=3.3.0",
    
    # Security constraints for transitive dependencies
    "wheel>=0.46.2",
    "virtualenv>=20.36.1",
]


[tool.black]
line-length = 180
target-version = ["py313"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pyplayground"

[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.isort]
profile = "black"
line_length = 180
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv"]
skip_glob = [".venv/*"]
known_first_party = ["pyplayground", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.hatch.build.targets.wheel]
# Tell hatch that the code lives directly in 'src' and should be packaged at the root
packages = ["pyplayground"]

[tool.flake8]
docstring-convention = "google"
