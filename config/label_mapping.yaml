# config/label_mapping.yaml
# Maps group IDs generated by schedule_balancer to the desired label VALUE.
# The label KEY will be provided via the --label-key CLI argument.

group_0: high-priority-backup
group_1: standard-backup
group_2: low-priority-backup
group_3: standard-backup # Multiple groups can map to the same value
# Namespaces in groups not listed here (e.g., group_4, group_5 if they exist in JSON)
# will be skipped by default. 