[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyplayground"
version = "0.1.0"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
description = "A Python-based mock and testing environment for Kubernetes, VMware, and HashiCorp Vault APIs"
readme = "README.md"
requires-python = ">=3.9,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "kubernetes>=25.3.0",
    "pyvmomi>=8.0.3.0.1",
    "hvac>=1.2.1",
    "click>=8.1.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "structlog>=23.2.0",
    "rich>=14.0.0",
    "boto3>=1.37.0",
    "cryptography>=44.0.0",
    "filelock>=3.18.0",
    "pyOpenSSL>=25.0.0",
    "pick>=2.4.0",
    "pint>=0.24.0",
    "tenacity>=9.1.0",
    "markdown>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "isort>=5.13.0",
    "pre-commit>=4.2.0",
    "pip-tools>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = "tools/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pyplayground"

[tool.mypy]
python_version = "3.9"
mypy_path = "stubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.flake8]
max-line-length = 100
max-complexity = 10
docstring-convention = "google"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "tools",
]
extend-ignore = [
    "E203",  # Existing: whitespace before ':' (needed for black)
    "D105",  # From .flake8: Missing docstring in magic method
    "E402",  # From .flake8: Module level import not at top of file
    "E501",  # From .flake8: Line too long (handled by black, but good to ignore in flake8)
    "W503",  # From .flake8: Line break before binary operator (conflicts with black)
    "D401",  # From .flake8: First line should be imperative mood
    "D200",  # From .flake8: One-line docstring should fit on one line
]
per-file-ignores = [
    "__init__.py:F401", # Allow unused imports in __init__
    "tests/*:D100,D101,D102,D103", # Allow missing docstrings in tests
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv"]
skip_glob = [".venv/*"]
known_first_party = ["utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.hatch.build.targets.wheel]
# Tell hatch that the code lives directly in 'src' and should be packaged at the root
packages = ["src"]
