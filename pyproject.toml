[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyplayground"
version = "0.1.0"
authors = [
    { name = "David Fischer", email = "fischer.d.r@gmail.com" }
]
description = "A Python-based mock and testing environment for Kubernetes, VMware, and HashiCorp Vault APIs"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

]
dependencies = [
    "ansible-builder>=3.1.1",
    "ansible-core>=2.20.3",
    "ansible-runner>=2.4.2",
    "awxkit>=24.6.1",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.42.56",
    "click>=8.3.1",
    "cryptography>=46.0.5",
    "filelock>=3.24.3",
    "hvac>=2.4.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "kubernetes>=35.0.0",
    "librosa>=0.11.0",
    "markdown>=3.10.2",
    "numpy>=2.0.0",
    "pick>=2.4.0",
    "pillow>=11.0.0",
    "pint>=0.25.2",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.11",
    "pydub>=0.25.0",
    "pyOpenSSL>=25.3.0",
    "pyasn1>=0.6.2",
    "python-dotenv>=1.2.1",
    "pyvmomi>=9.0.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "scipy>=1.14.0",
    "textual>=8.0.2",
    "tenacity>=9.1.4",
    "tqdm>=4.66.0",
    "typer>=0.24.1",
    "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    # Formatting
    "black>=26.1.0",
    "isort>=8.0.0",
    # Linting
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "flake8-docstrings>=1.7.0",
    "pep8-naming>=0.15.1",
    "ruff>=0.15.2",
    # Markdown
    "pymarkdownlnt>=0.9.35",
    # Type checking
    "mypy>=1.19.1",
    "types-Pillow>=10.0.0",
    # Documentation
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.8.0",
    "sphinx-rtd-theme>=1.3.0",
    # Tooling
    "pip-tools>=7.5.3",
    "pre-commit>=4.5.1",
    "virtualenv>=20.39.0",
    "wheel>=0.46.3",
]


[tool.black]
line-length = 180
target-version = ["py313"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=pyplayground"

[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[tool.isort]
profile = "black"
line_length = 180
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv"]
skip_glob = [".venv/*"]
known_first_party = ["pyplayground", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.hatch.build.targets.wheel]
packages = ["pyplayground"]

[tool.flake8]
docstring-convention = "google"
