---
# Test playbook to validate the Vault multi-namespace monitoring playbook
# This playbook runs basic validation tests without requiring actual Vault access

- name: Test Vault Multi-Namespace Monitoring Playbook
  hosts: localhost
  gather_facts: false
  vars:
    # Test variables
    test_target_namespace: "test-namespace"
    test_secret_paths: "test/secret1,test/secret2"
    test_vault_namespaces: "test-vault-ns1,test-vault-ns2"
    test_px_namespace: "test-portworx"
    test_debug: true
    test_mask_values: true

  tasks:
    - name: Test 1 - Validate required variables
      ansible.builtin.debug:
        msg:
          - "Test 1: Validating required variables"
          - "Target namespace: {{ test_target_namespace }}"
          - "Secret paths: {{ test_secret_paths }}"
          - "Vault namespaces: {{ test_vault_namespaces }}"
          - "Portworx namespace: {{ test_px_namespace }}"

    - name: Test 2 - Parse and validate input lists
      ansible.builtin.set_fact:
        test_secret_path_list: "{{ test_secret_paths.split(',') | map('trim') | list }}"
        test_vault_namespace_list: "{{ test_vault_namespaces.split(',') | map('trim') | list }}"

    - name: Test 3 - Validate list lengths match
      ansible.builtin.assert:
        that:
          - test_secret_path_list | length == test_vault_namespace_list | length
        fail_msg: "Secret paths and Vault namespaces must have the same number of elements"
        success_msg: "List lengths match correctly"

    - name: Test 4 - Test result structure
      ansible.builtin.set_fact:
        test_result:
          namespace: "{{ test_target_namespace }}"
          secret_path: "{{ test_secret_path_list[0] }}"
          vault_namespace: "{{ test_vault_namespace_list[0] }}"
          success: false
          status: "Test Status"
          auth_success: false
          secret_access_success: false
          data: null
          error_message: null

    - name: Test 5 - Display test result structure
      ansible.builtin.debug:
        msg:
          - "Test result structure:"
          - "  Namespace: {{ test_result.namespace }}"
          - "  Secret Path: {{ test_result.secret_path }}"
          - "  Vault Namespace: {{ test_result.vault_namespace }}"
          - "  Success: {{ test_result.success }}"
          - "  Status: {{ test_result.status }}"
          - "  Auth Success: {{ test_result.auth_success }}"
          - "  Secret Access Success: {{ test_result.secret_access_success }}"

    - name: Test 6 - Test results table generation
      ansible.builtin.set_fact:
        test_results: "{{ [test_result] }}"

    - name: Test 7 - Generate results summary table
      ansible.builtin.set_fact:
        test_summary: |
          | Namespace | Secret Path | Vault Namespace | Auth | Secret Access | Status |
          |-----------|-------------|-----------------|------|----------------|--------|
          {% for result in test_results %}
          | {{ result.namespace }} | {{ result.secret_path }} | {{ result.vault_namespace }} |
            {{ '✓' if result.auth_success else '✗' }} | {{ '✓' if result.secret_access_success else '✗' }} | {{ result.status }} |
          {% endfor %}

    - name: Test 8 - Display results table
      ansible.builtin.debug:
        msg: "{{ test_summary }}"

    - name: Test 9 - Test success rate calculation
      ansible.builtin.set_fact:
        test_successful: "{{ test_results | selectattr('success', 'equalto', true) | list | length }}"
        test_total: "{{ test_results | length }}"

    - name: Test 10 - Display success rate
      ansible.builtin.debug:
        msg:
          - "Test Results Summary:"
          - "  Total tests: {{ test_total }}"
          - "  Successful tests: {{ test_successful }}"
          - "  Success rate: {{ test_successful }}/{{ test_total }}"

    - name: Test 11 - Validate playbook structure
      ansible.builtin.stat:
        path: "{{ item }}"
      register: playbook_files
      loop:
        - playbook.yml
        - vault_test_tasks.yml
        - requirements.yml
        - README.md
        - inventory.yml
        - ansible.cfg
        - run_tests.sh

    - name: Test 12 - Check if all required files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Required file {{ item.item }} does not exist"
        success_msg: "File {{ item.item }} exists"
      loop: "{{ playbook_files.results }}"

    - name: Test 13 - Test inventory file syntax
      ansible.builtin.include_vars:
        file: inventory.yml
        name: inventory_test

    - name: Test 14 - Validate inventory structure
      ansible.builtin.assert:
        that:
          - inventory_test is defined
          - inventory_test.all is defined
          - inventory_test.all.hosts is defined
        fail_msg: "Inventory file structure is invalid"
        success_msg: "Inventory file structure is valid"

    - name: Test 15 - Test requirements file syntax
      ansible.builtin.command: ansible-galaxy collection install --check-mode -r requirements.yml
      register: requirements_check
      changed_when: requirements_check.rc != 0 # <- Uses the return code to define when the task has changed.
      failed_when: false

    - name: Test 16 - Validate requirements file
      ansible.builtin.debug:
        msg: "Requirements file validation: {{ 'PASSED' if requirements_check.rc == 0 else 'FAILED' }}"

    - name: Test 17 - Test playbook syntax
      ansible.builtin.command: ansible-playbook --syntax-check playbook.yml
      register: syntax_check
      changed_when: syntax_check.rc != 0 # <- Uses the return code to define when the task has changed.
      failed_when: false

    - name: Test 18 - Validate playbook syntax
      ansible.builtin.debug:
        msg: "Playbook syntax check: {{ 'PASSED' if syntax_check.rc == 0 else 'FAILED' }}"

    - name: Test 19 - Final test summary
      ansible.builtin.debug:
        msg:
          - "=== TEST SUMMARY ==="
          - "All basic validation tests completed successfully"
          - "Playbook structure is valid"
          - "Inventory file is valid"
          - "Requirements file is valid"
          - "Ready for deployment with actual Vault configuration"
