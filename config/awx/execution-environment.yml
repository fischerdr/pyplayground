---
version: 1

build_arg_defaults:
  EE_BASE_IMAGE: 'quay.io/ansible/awx-ee:latest'
  EE_BUILDER_IMAGE: 'quay.io/ansible/ansible-runner:latest'

dependencies:
  galaxy:
    requirements: requirements.yml
  python:
    requirements: requirements.txt
  system:
    requirements: bindep.txt

images:
  base_image:
    name: quay.io/ansible/awx-ee:latest
  builder_image:
    name: quay.io/ansible/ansible-runner:latest

options:
  package_manager_path: /usr/bin/dnf
  skip_ansible_check: false
  relax_password_requirements: false
  workdir: /runner/project
  container_init: true
  entrypoint: /usr/bin/entrypoint
  user: 1000
  additional_build_steps:
    prepend: |
      RUN dnf install -y git git-lfs && \
          dnf clean all && \
          rm -rf /var/cache/dnf
    append: |
      RUN mkdir -p /runner/project && \
          chown -R 1000:1000 /runner/project

additional_build_files:
  src: build/
  dest: /build/

ansible_config: build/configs/ansible.cfg 