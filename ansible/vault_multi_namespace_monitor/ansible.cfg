[defaults]
# Ansible configuration for Vault multi-namespace monitoring
inventory = inventory.yml
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = memory

# Logging configuration
log_path = ./ansible.log
stdout_callback = yaml
bin_ansible_callbacks = True

# Connection settings
connection = local
transport = local

# Performance settings
forks = 10
strategy = free

# Security settings
remote_tmp = /tmp/.ansible-{{ ansible_user }}

[inventory]
# Enable inventory plugins
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
# No privilege escalation needed for local execution
become = False

[colors]
# Color output for better readability
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
