---
# Main tasks for vault_multi_namespace_monitor role

- name: Validate required variables
  ansible.builtin.fail:
    msg: "{{ item }} is required"
  when: item is not defined or item == ""
  loop:
    - "{{ vault_monitor_target_namespace }}"
    - "{{ vault_monitor_secret_paths }}"
    - "{{ vault_monitor_vault_namespaces }}"

- name: Parse secret paths and vault namespaces
  ansible.builtin.set_fact:
    vault_monitor_secret_path_list: "{{ vault_monitor_secret_paths.split(',') | map('trim') | list }}"
    vault_monitor_vault_namespace_list: "{{ vault_monitor_vault_namespaces.split(',') | map('trim') | list }}"

- name: Validate that secret paths and vault namespaces have same length
  ansible.builtin.fail:
    msg: "Secret paths and Vault namespaces must have the same number of elements. Got {{ vault_monitor_secret_path_list | length }} secret paths and {{ vault_monitor_vault_namespace_list | length }} vault namespaces"
  when: vault_monitor_secret_path_list | length != vault_monitor_vault_namespace_list | length

- name: Display test configuration
  ansible.builtin.debug:
    msg:
      - "Testing Kubernetes namespace: {{ vault_monitor_target_namespace }}"
      - "Secret paths: {{ vault_monitor_secret_path_list }}"
      - "Vault namespaces: {{ vault_monitor_vault_namespace_list }}"
      - "Portworx namespace: {{ vault_monitor_px_namespace }}"
      - "Debug mode: {{ vault_monitor_debug }}"
      - "Mask values: {{ vault_monitor_mask_values }}"
  when: vault_monitor_debug | bool

- name: Check if kubectl is available
  ansible.builtin.command: which kubectl
  register: kubectl_check
  failed_when: kubectl_check.rc != 0
  changed_when: false

- name: Get Vault connection information from Kubernetes secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ vault_monitor_vault_addr_secret_name }}"
    namespace: "{{ vault_monitor_px_namespace }}"
    kubeconfig: "{{ vault_monitor_kubeconfig if vault_monitor_kubeconfig else omit }}"
    verify_ssl: "{{ vault_monitor_k8s_verify_ssl }}"
    ca_cert: "{{ vault_monitor_k8s_ssl_ca_cert if vault_monitor_k8s_ssl_ca_cert else omit }}"
  register: vault_secret
  failed_when: false

- name: Fail if Vault secret not found
  ansible.builtin.fail:
    msg: "Secret '{{ vault_monitor_vault_addr_secret_name }}' not found in namespace '{{ vault_monitor_px_namespace }}'"
  when: vault_secret.resources | length == 0

- name: Extract Vault connection information
  ansible.builtin.set_fact:
    vault_monitor_vault_conn_info:
      addr: "{{ (vault_secret.resources[0].data[vault_monitor_vault_addr_secret_key] | b64decode) | trim }}"
      backend_path: "{{ (vault_secret.resources[0].data[vault_monitor_vault_backend_path_key] | b64decode) | trim }}"
      auth_role: "{{ (vault_secret.resources[0].data[vault_monitor_vault_auth_role_key] | b64decode) | trim }}"
      auth_mount_path: "{{ (vault_secret.resources[0].data[vault_monitor_vault_auth_mount_path_key] | b64decode) | trim }}"
  when: vault_secret.resources | length > 0

- name: Display Vault connection info (masked)
  ansible.builtin.debug:
    msg:
      - "Vault Address: {{ vault_monitor_vault_conn_info.addr }}"
      - "Backend Path: {{ vault_monitor_vault_conn_info.backend_path }}"
      - "Auth Role: {{ vault_monitor_vault_conn_info.auth_role }}"
      - "Auth Mount Path: {{ vault_monitor_vault_conn_info.auth_mount_path }}"
  when: vault_monitor_debug | bool

- name: Get service account JWT token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ServiceAccount
    name: "{{ vault_monitor_vault_sa_name }}"
    namespace: "{{ vault_monitor_px_namespace }}"
    kubeconfig: "{{ vault_monitor_kubeconfig if vault_monitor_kubeconfig else omit }}"
    verify_ssl: "{{ vault_monitor_k8s_verify_ssl }}"
    ca_cert: "{{ vault_monitor_k8s_ssl_ca_cert if vault_monitor_k8s_ssl_ca_cert else omit }}"
  register: sa_info
  failed_when: false

- name: Fail if service account not found
  ansible.builtin.fail:
    msg: "Service account '{{ vault_monitor_vault_sa_name }}' not found in namespace '{{ vault_monitor_px_namespace }}'"
  when: sa_info.resources | length == 0

- name: Get service account token secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ vault_monitor_px_namespace }}"
    label_selectors:
      - "kubernetes.io/service-account.name={{ vault_monitor_vault_sa_name }}"
    kubeconfig: "{{ vault_monitor_kubeconfig if vault_monitor_kubeconfig else omit }}"
    verify_ssl: "{{ vault_monitor_k8s_verify_ssl }}"
    ca_cert: "{{ vault_monitor_k8s_ssl_ca_cert if vault_monitor_k8s_ssl_ca_cert else omit }}"
  register: sa_token_secret
  failed_when: false

- name: Fail if service account token not found
  ansible.builtin.fail:
    msg: "Service account token for '{{ vault_monitor_vault_sa_name }}' not found in namespace '{{ vault_monitor_px_namespace }}'"
  when: sa_token_secret.resources | length == 0

- name: Extract service account JWT
  ansible.builtin.set_fact:
    vault_monitor_sa_jwt: "{{ (sa_token_secret.resources[0].data.token | b64decode) | trim }}"
  when: sa_token_secret.resources | length > 0

- name: Initialize test results list
  ansible.builtin.set_fact:
    vault_monitor_test_results: []

- name: Run Vault tests for each namespace/secret combination
  ansible.builtin.include_tasks: vault_test_tasks.yml
  loop: "{{ vault_monitor_secret_path_list | zip(vault_monitor_vault_namespace_list) | list }}"
  vars:
    current_secret_path: "{{ item[0] }}"
    current_vault_namespace: "{{ item[1] }}"
    test_index: "{{ loop.index }}"

- name: Display test results summary
  ansible.builtin.debug:
    msg:
      - "=== VAULT MULTI-NAMESPACE TEST RESULTS ==="
      - "Total tests: {{ vault_monitor_test_results | length }}"
      - "Successful tests: {{ vault_monitor_test_results | selectattr('success', 'equalto', true) | list | length }}"
      - "Failed tests: {{ vault_monitor_test_results | selectattr('success', 'equalto', false) | list | length }}"

- name: Display detailed results for each test
  ansible.builtin.debug:
    msg:
      - "Test {{ loop.index }}: {{ item.namespace }} - {{ item.secret_path }}"
      - "  Vault Namespace: {{ item.vault_namespace }}"
      - "  Authentication: {{ 'SUCCESS' if item.auth_success else 'FAILED' }}"
      - "  Secret Access: {{ 'SUCCESS' if item.secret_access_success else 'FAILED' }}"
      - "  Overall Status: {{ item.status }}"
      - "  Error: {{ item.error_message if item.error_message else 'None' }}"
      - "  Secret Data Keys: {{ item.data.keys() | list if item.data else 'None' }}"
  loop: "{{ vault_monitor_test_results }}"
  when: vault_monitor_debug | bool

- name: Create results summary table
  ansible.builtin.set_fact:
    results_summary: |
      | Namespace | Secret Path | Vault Namespace | Auth | Secret Access | Status |
      |-----------|-------------|-----------------|------|----------------|--------|
      {% for result in vault_monitor_test_results %}
      | {{ result.namespace }} | {{ result.secret_path }} | {{ result.vault_namespace }} |
        {{ '✓' if result.auth_success else '✗' }} | {{ '✓' if result.secret_access_success else '✗' }} | {{ result.status }} |
      {% endfor %}

- name: Display results table
  ansible.builtin.debug:
    msg: "{{ results_summary }}"

- name: Calculate success rate
  ansible.builtin.set_fact:
    successful_tests: "{{ vault_monitor_test_results | selectattr('success', 'equalto', true) | list | length }}"
    total_tests: "{{ vault_monitor_test_results | length }}"

- name: Display final summary
  ansible.builtin.debug:
    msg:
      - "=== FINAL SUMMARY ==="
      - "Success Rate: {{ successful_tests }}/{{ total_tests }} tests passed"
      - "{{ 'All tests passed!' if successful_tests == total_tests else (total_tests - successful_tests) | string + ' test(s) failed.' }}"

- name: Fail if any tests failed
  ansible.builtin.fail:
    msg: "{{ total_tests - successful_tests }} test(s) failed. Check the detailed results above."
  when: successful_tests != total_tests
